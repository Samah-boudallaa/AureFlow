<script>
const COURS=[
["Ch0 – Vue d’ensemble de l’IoT",["Terme <b>IoT</b> : Kevin Ashton, 1999 (RFID). 1ʳᵉ appli : cafetière de Cambridge, 1991. IoT « né » en 2008-2009 (plus d’objets que d’humains connectés – Cisco IBSG).","<b>M2M</b> : échanges entre machines sans intervention humaine. <b>IoE</b> = IoT + processus + données + personnes.","Techs basse conso : SIGFOX, LoRaWAN, Zigbee, 6LoWPAN, BLE (Wi-Fi/3G/4G/Bluetooth trop gourmands).","Archi : <b>3 couches</b> (perception, réseau, application) → <b>4</b> (+ support/cloud) → <b>5</b> (+ middleware/métier).","<b>MQTT</b> : publish/subscribe sur TCP/IP, header de 2 octets, broker (Mosquitto) + clients (Paho, HiveMQ).","Composants : objet (capteurs/actionneurs), <b>passerelle</b> (RPi, BeagleBone), cloud. Edge/Fog/Mist = traitement local. <b>IaaS / PaaS / SaaS</b>.","Défis : fiabilité, interopérabilité, sécurité, scalabilité, réglementation, propriété intellectuelle."]],
["Ch1 – Systèmes embarqués",["Système embarqué : autonome, souvent temps réel, dédié à une tâche. Contraintes : coût, mémoire, calcul, autonomie, temps, sûreté, sécurité.","<b>Transformationnel</b> (lit → calcule → s’éteint) · <b>Interactif</b> (rythme fixé par le système) · <b>Réactif/temps réel</b> (rythme imposé par l’environnement : airbag, ABS, défibrillateur).","Temps réel <b>dur</b> : échéance jamais dépassée. <b>Mou</b> : dégradation tolérée. Temps réel ≠ rapide.","Fonctionnement : boucle infinie ; <b>cyclique</b> (polling) ou <b>événementiel</b> (interruptions, priorités, préemption).","<b>Von Neumann</b> : bus unique → goulot d’étranglement. <b>Harvard</b> : 2 mémoires + 2 bus (AVR, PIC, DSP, cache L1I/L1D).","<b>µC = µP + périphériques</b> (Flash, RAM, E/S, UART/SPI/I2C/CAN). Différence fiable : <b>pas d’OS</b>. SoC (Raspberry Pi, smartphone) : avec OS."]],
["Ch2 – Plateforme Arduino",["Alim : 5 V USB ou 7–12 V externe (régulateur). 14 E/S numériques (D0–D13, D0/D1 = série, LED sur D13) + A0–A5.","<b>Limites</b> : 40 mA/port, 200 mA total, jamais &gt; 5,5 V en entrée. Résistance mini ≈ <b>125 Ω</b> (200 Ω conseillé). Jamais de court-circuit (5V–GND, 2 sorties reliées).","<b>CAN 10 bits</b> : 0–5 V → 0–1023 (<code>analogRead</code>). <b>PWM 8 bits</b> : 0–255 sur 3, 5, 6, 9, 10, 11 (<code>analogWrite</code>) ; 127 ≈ 2,5 V moyen.","Programme : déclarations → <code>setup()</code> (1 fois) → <code>loop()</code> (infini). Fonctions : pinMode, digitalWrite/Read, delay, millis, Serial.","Entrée flottante → pull-down (10 kΩ) ou pull-up. LED : anode = patte longue, résistance obligatoire. <b>P = U·I</b>."]],
["Ch3 – Capteurs &amp; actionneurs",["<b>Capteur</b> : grandeur physique → signal électrique (≠ instrument de mesure autonome). Familles : <b>analogique</b> (valeurs continues), <b>TOR</b> (détecte, 2 niveaux), <b>numérique</b> (séquence de bits/impulsions).","Bouton : sans pull-up/down → entrée flottante (valeurs aléatoires).","<b>DHT11</b> : 0–50 °C ±2 °C, HR 20–90 % ±5 %, 1 fil. <b>HC-SR04</b> : 2–400 cm, Trig/Echo, <code>cm = (durée/2)/29,1</code>. Photorésistance : <code>analogRead(A0)</code>.","<b>Actionneur</b> : signal électrique → grandeur physique. RGB LED (cathode ou anode commune, PWM + 220 Ω), buzzer (<code>tone/noTone</code>), LCD (<code>LiquidCrystal</code>)."]],
["Ch4 – ATmega328 &amp; interruptions",["8 bits AVR · Flash 32 Ko · SRAM 2 Ko · EEPROM 1 Ko · ports B, C, D · Timer0/2 (8 bits), Timer1 (16 bits) · 6 PWM · ADC 10 bits.","Broches 0–7 → PD0–7 · 8–13 → PB0–5 · A0–A5 → PC0–5. Ex : pin 13 = PB5, pin 10 = PB2.","<b>DDRx</b> direction (1 = sortie) · <b>PORTx</b> écriture · <b>PINx</b> lecture.","Mise à 1 : <code>REG |= mask</code> · mise à 0 : <code>REG &amp;= ~mask</code> · inversion : <code>REG ^= mask</code> · lecture : <code>(REG&gt;&gt;n)&amp;1</code> · mask = <code>1&lt;&lt;n</code>.","<b>SREG</b> bit 7 = I (autorisation globale), <code>sei()</code>/<code>cli()</code>. Pull-up interne : DDRx.n=0 <b>et</b> PORTx.n=1 ; <b>PUD</b> (MCUCR) les coupe toutes. Pas de pull-down interne.","<code>attachInterrupt(digitalPinToInterrupt(pin),ISR,mode)</code> : INT0=pin 2, INT1=pin 3 ; modes LOW, CHANGE, RISING, FALLING. ISR courte, <b>sans delay()/Serial</b>, variables <code>volatile</code>. Priorité : INT0 &gt; INT1 &gt; PCINT0-2."]],
["TD1 &amp; TD2 – À savoir refaire",["Airbag A (10 ns garanti) vs B (1 ns à 99 %) : à 4 cycles/instr → A : 16 MHz/4 = <b>4 M instr/s</b>, B : 1 GHz/4 = <b>250 M</b>. B plus rapide, mais on choisit <b>A</b> (déterminisme = temps réel dur).","Potentiomètre 90°/360° → 1,25 V → <code>analogRead</code> ≈ <b>255</b> (CAN, 10 bits). Moteur à 50 % : <code>analogWrite(pin,127)</code> sur broche PWM ; tension réelle alternée 0 V/5 V, moyenne 2,5 V.","TD2 : <code>01001100 | (1&lt;&lt;5)</code> = 01101100 · <code>01001111 &amp; ~(1&lt;&lt;2)</code> = 01001011 · permuter bits 0 et 3 de 01111100 (différents) : <code>^ 0x09</code> = 01110101 · bit 6 de 01110000 : <code>(x&gt;&gt;6)&amp;1</code> = 1.","LED broche 13 : <code>DDRB |= 1&lt;&lt;PB5; PORTB |= 1&lt;&lt;PB5;</code> · bouton pin 2 (actif à 0 V) → pull-up interne + LED pin 3 : <code>DDRD&amp;=~(1&lt;&lt;2); PORTD|=1&lt;&lt;2; DDRD|=1&lt;&lt;3;</code> puis si <code>!(PIND&amp;(1&lt;&lt;2))</code> allumer."]]];
// [niveau,chap,question,options,bonne,explication]
const Q=[
[0,0,"Qui a employé le terme « Internet of Things » en 1999 ?",["Kevin Ashton","Tim Berners-Lee","Andy Stanford-Clark","Arlen Nipper"],0,"Ashton l’a utilisé pour décrire les puces RFID."],
[0,0,"Quelles sont les 3 couches de l’architecture IoT de base ?",["Physique, liaison, transport","Perception, réseau, application","Capteur, cloud, utilisateur","Support, middleware, métier"],1,"3 couches : perception, réseau, application."],
[0,1,"Un système temps réel doit avant tout…",["être très rapide","respecter ses échéances","consommer peu","fonctionner sans mémoire"],1,"Temps réel ≠ rapide : l’échéance doit être respectée."],
[0,1,"Un airbag est un système…",["transformationnel","interactif","réactif temps réel dur","temps réel mou"],2,"L’environnement impose le rythme et l’échéance est critique."],
[0,2,"Quelle plage renvoie analogRead() sur Arduino UNO ?",["0–255","0–1023","0–4095","0–5"],1,"CAN 10 bits : 2¹⁰−1 = 1023."],
[0,2,"Quelles broches de l’UNO supportent le PWM ?",["0,1,2,3,4,5","3,5,6,9,10,11","8 à 13","A0 à A5"],1,"Signalées par ~ sur la carte."],
[0,2,"La fonction setup() s’exécute…",["en boucle infinie","une seule fois au démarrage","à chaque interruption","toutes les secondes"],1,"loop() est la boucle infinie."],
[0,3,"Un capteur TOR délivre…",["une infinité de valeurs","deux niveaux logiques","un nombre binaire de n bits","une fréquence uniquement"],1,"Il détecte (0/1) et ne mesure pas."],
[0,3,"Un actionneur transforme…",["une grandeur physique en signal électrique","un signal électrique en grandeur physique","un signal analogique en numérique","des données en texte"],1,"Lumière, son, mouvement… (inverse d’un capteur)."],
[0,4,"Quel registre définit la direction d’une broche ?",["PORTx","PINx","DDRx","SREG"],2,"DDRx.n = 1 → sortie."],
[0,4,"La broche Arduino 13 correspond à…",["PD5","PB5","PC5","PB3"],1,"Broches 8–13 → PB0–PB5."],
[0,4,"Quelle fonction active les interruptions globalement ?",["cli()","sei()","attachInterrupt()","pinMode()"],1,"sei() met le bit I de SREG à 1."],
[1,0,"MQTT est un protocole…",["requête/réponse sur UDP","publish/subscribe sur TCP/IP","de couche physique","réservé au Bluetooth"],1,"Header de 2 octets, broker central."],
[1,1,"L’ATmega328 suit l’architecture…",["Von Neumann pure","Harvard","VLIW","Aucune"],1,"Mémoires programme et données séparées (2 bus)."],
[1,1,"Le critère le plus fiable pour distinguer µC et µP ?",["La taille","La vitesse","L’absence de système d’exploitation","Le prix"],2,"Taille et perfs sont trompeuses (SoC)."],
[1,2,"Résistance minimale entre une sortie 5 V et GND (40 mA max) ?",["25 Ω","125 Ω","1 kΩ","10 kΩ"],1,"R = 5 V / 0,04 A = 125 Ω."],
[1,2,"analogWrite(6,100) donne une tension moyenne de…",["1,00 V","1,96 V","2,5 V","3,9 V"],1,"100/255 × 5 V ≈ 1,96 V."],
[1,3,"Dans HC-SR04, pourquoi diviser la durée par 2 ?",["Capteur à 2 transducteurs","L’onde fait un aller-retour","Pour passer en cm","Pour filtrer le bruit"],1,"cm = (durée/2)/29,1."],
[1,3,"Comment éviter une entrée flottante avec un bouton ?",["Mettre la broche en OUTPUT","Utiliser une résistance pull-up ou pull-down","Ajouter un delay()","Utiliser analogRead"],1,"Elle force un niveau défini quand le bouton est ouvert."],
[1,4,"PORTB |= 0x20; fait…",["PB5 = 0 et le reste inchangé","PB5 = 1 et le reste inchangé","tout PORTB à 0x20","inverse PB5"],1,"0x20 = 1<<5 : OU logique = mise à 1."],
[1,4,"Pull-up interne activée si…",["DDRx.n=1 et PORTx.n=1","DDRx.n=0 et PORTx.n=1","DDRx.n=0 et PORTx.n=0","PUD=1"],1,"Entrée + PORT à 1 (et PUD=0)."],
[1,4,"0x0F ^ 0x11 vaut…",["0x1F","0x1E","0x01","0xFE"],1,"XOR : 00001111 ⊕ 00010001 = 00011110."],

function tds(){return `<h2>Travaux dirigés corrigés</h2><p class="sub">Cherche d’abord sans regarder, puis ouvre la correction.</p>`+TDX.map(t=>`<details><summary>${t[0]}</summary><div style="padding:0 15px 12px"><p class="sm">${t[1]}</p><details><summary>Voir la correction</summary><div style="padding:0 14px 12px">${t[2]}</div></details></div></details>`).join("")}
function labo(){return `<h2>Laboratoire</h2><div class="cd"><h3>Manipulation de bits</h3><p class="sm">Clique sur les bits de REG, choisis l’opération et le rang n. Le masque est <code>1&lt;&lt;n</code>.</p><div class="bits" id="bits"></div><p><select onchange="op=+this.value;calc()"><option value="0">Mettre à 1 (|=)</option><option value="1">Mettre à 0 (&amp;= ~)</option><option value="2">Inverser (^=)</option><option value="3">Lire (&gt;&gt; puis &amp; 1)</option></select> rang n <select onchange="nb=+this.value;calc()">${[0,1,2,3,4,5,6,7].map(n=>`<option ${n==nb?"selected":""}>${n}</option>`).join("")}</select></p><div id="res"></div></div>
<div class="cd"><h3>Convertisseurs</h3><p>Tension (V) → analogRead : <input id="v" type="number" step="0.01" value="1.25" style="width:90px" oninput="cv()"> = <b id="o1"></b></p><p>Valeur PWM (0–255) → tension moyenne : <input id="p" type="number" value="127" min="0" max="255" style="width:90px" oninput="cv()"> = <b id="o2"></b></p><p>HC-SR04 : durée (µs) <input id="d" type="number" value="1164" style="width:90px" oninput="cv()"> = <b id="o3"></b></p><p>Courant : R (Ω) sous 5 V <input id="r" type="number" value="125" style="width:90px" oninput="cv()"> = <b id="o4"></b></p></div>`}
function calc(){const m=1<<nb,code=["REG |= 1<<"+nb+";","REG &= ~(1<<"+nb+");","REG ^= 1<<"+nb+";","bit = (REG>>"+nb+") & 1;"][op],r=[reg|m,reg&~m&255,(reg^m)&255,(reg>>nb)&1][op];
$("#bits").innerHTML=[7,6,5,4,3,2,1,0].map(i=>`<button class="bit ${reg>>i&1?"h":""} ${i==nb?"m":""}" onclick="reg^=1<<${i};calc()">${reg>>i&1}</button>`).join("");
$("#res").innerHTML=`<p class="mono">REG = ${bin(reg)} (${hx(reg)})<br>masque = ${bin(m)} (${hx(m)})<br>${op==3?"résultat = "+r:"REG devient "+bin(r)+" ("+hx(r)+")"}</p><p><code>${code}</code></p>`;cv()}
function cv(){if(!$("#v"))return;const c=(x,a,b)=>Math.min(Math.max(+x,a),b);$("#o1").textContent=Math.floor(c($("#v").value,0,5)/5*1023);$("#o2").textContent=(c($("#p").value,0,255)/255*5).toFixed(2)+" V";$("#o3").textContent=($("#d").value/2/29.1).toFixed(1)+" cm";const r=+$("#r").value||1,i=5/r*1000;$("#o4").textContent=i.toFixed(1)+" mA"+(i>40?" (dépasse 40 mA)":" (OK)")}
const pool=()=>Q.map((q,i)=>i).filter(i=>(fc==null||Q[i][1]==fc)&&(fl==null||Q[i][0]==fl));
function train(){const ch=(a,k,f)=>`<div class="chips">${["Tous",...a].map((n,i)=>`<button class="chip ${(f==null?0:f+1)==i?"on":""}" onclick="${k}=${i?i-1:null};go(5)">${n}</button>`).join("")}</div>`;
return `<h2>Entraînement</h2><p class="sub">Correction immédiate. Raccourcis clavier : 1 à 4 pour répondre, Entrée pour continuer.</p><div class="cd"><b>Chapitre</b>${ch(CH,"fc",fc)}<b>Niveau</b>${ch(LV,"fl",fl)}<button class="b p" onclick="begin(pool(),0)" ${pool().length?"":"disabled"}>Lancer (${pool().length} questions)</button> <button class="b" onclick="st.w.length&&begin(st.w.slice(),0)">Revoir mes erreurs (${st.w.length})</button></div>`}
function exam(){const T=[["Facile","Fondamentaux, définitions"],["Moyen","Applications directes, calculs simples"],["Difficile","Registres, ISR, pièges du TD"],["Mixte","10 questions tous niveaux"],["Complet","20 questions, 20 minutes"]];
return `<h2>Examen blanc</h2><p class="sub">Conditions réelles : chronomètre, pas de correction pendant l’épreuve, note sur 20 et revue détaillée.</p><div class="g">${T.map((t,i)=>`<div class="cd"><span class="tag ${i<3?"lv"+i:""}">${t[0]}</span><p class="sm">${t[1]}<br>${i<3?Q.filter(q=>q[0]==i).length+" questions en banque":""}</p><button class="b p" onclick="runE(${i})">Commencer</button></div>`).join("")}</div>`}
function runE(l){el=l;const p=Q.map((q,i)=>i).filter(i=>l>=3||Q[i][0]==l);begin(p,l==4?20:10)}
function begin(p,ex){const ids=sh(p).slice(0,ex||99);R={qs:ids.map(i=>({i,q:Q[i],o:sh(Q[i][3].map((t,k)=>({t,k})))})),i:0,sc:0,a:[],ex,t:Date.now(),l:null,n:ids.length};if(ex){clearInterval(tm);tm=setInterval(()=>{const left=R.n*60-Math.floor((Date.now()-R.t)/1000),e=$("#tm");if(left<=0){clearInterval(tm);fin()}else if(e)e.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0")},500)}ask()}
function ask(){const x=R.qs[R.i],q=x.q;R.l=null;$("#m").innerHTML=`<div class="cd"><div class="sm">${R.ex?"Examen":"Entraînement"} · Question ${R.i+1} sur ${R.n} <span class="tag lv${q[0]}">${LV[q[0]]}</span> ${CH[q[1]]}${R.ex?'<span class="tm" id="tm"></span>':""}</div><div class="bar" style="margin:10px 0 14px"><i style="width:${R.i/R.n*100}%"></i></div><h3 style="font-size:1.15rem">${q[2]}</h3>${x.o.map((o,j)=>`<button class="opt" onclick="pick(${j})"><kbd>${j+1}</kbd><span>${o.t}</span></button>`).join("")}<div id="fb"></div></div>`}
function pick(j){if(!R||(R.l!=null&&!R.ex))return;const x=R.qs[R.i],q=x.q,ok=x.o[j].k==q[4];R.a.push(ok?1:0);R.sc+=ok;const a=st.c[q[1]]=st.c[q[1]]||[0,0];a[0]+=ok;a[1]++;const w=st.w.indexOf(x.i);if(!ok&&w<0)st.w.push(x.i);if(ok&&w>=0&&!R.ex)st.w.splice(w,1);sv();
if(R.ex)return nxt();R.l=j;document.querySelectorAll(".opt").forEach((b,k)=>{if(x.o[k].k==q[4])b.classList.add("ok");else if(k==j)b.classList.add("ko")});
$("#fb").innerHTML=`<div class="ex"><b>${ok?"Bonne réponse.":"Réponse incorrecte."}</b> ${q[5]}</div><p><button class="b p" onclick="nxt()">${R.i+1<R.n?"Question suivante":"Voir le résultat"}</button></p>`}
function nxt(){R.i++;R.i<R.n?ask():fin()}
function fin(){clearInterval(tm);const n=R.a.length||1,note=Math.round(R.sc/n*200)/10,s=Math.round((Date.now()-R.t)/1000);
if(R.ex){if(st.b[el]==null||note>st.b[el])st.b[el]=note;st.h.push({l:el,n:note});st.h=st.h.slice(-30);sv()}
const wr=R.qs.map((x,i)=>[x,R.a[i]]).filter(a=>a[1]===0),by=CH.map((c,k)=>{const t=R.qs.filter((x,i)=>x.q[1]==k&&R.a[i]!=null);return t.length?`<div class="kv"><span>${c}</span><b>${t.filter(x=>R.a[R.qs.indexOf(x)]).length} / ${t.length}</b></div>`:""}).join("");
const mention=note>=18?"Excellent":note>=14?"Très bien":note>=10?"Passable, continue":"À retravailler";
$("#m").innerHTML=`<div class="cd" style="text-align:center"><h2>${mention}</h2><div class="big">${note} / 20</div><p class="sub">${R.sc} bonnes réponses sur ${n} · ${Math.floor(s/60)} min ${s%60} s</p><button class="b p" onclick="${R.ex?"runE(el)":"begin(pool(),0)"}">Rejouer</button> <button class="b" onclick="go(${R.ex?6:5})">Retour</button></div><div class="cd"><h3>Résultats par chapitre</h3>${by}</div>${wr.length?`<div class="cd"><h3>Questions à revoir (${wr.length})</h3>${wr.map(([x])=>`<p><b>${x.q[2]}</b><br><span style="color:var(--ok)">Bonne réponse : ${x.q[3][x.q[4]]}</span><br><span class="sm">${x.q[5]}</span></p>`).join("")}</div>`:`<div class="cd">Sans-faute. Passe au niveau supérieur.</div>`}`}
addEventListener("keydown",e=>{if(!R||e.target.tagName=="INPUT")return;const k=+e.key;if(k>=1&&k<=4&&R.qs[R.i]&&(R.l==null||R.ex)&&R.qs[R.i].o[k-1])pick(k-1);else if((e.key=="Enter")&&R.l!=null&&!R.ex)nxt()});
go(0);

if(k||matchMedia("(prefers-reduced-motion:reduce)").matches){e.remove();return}
